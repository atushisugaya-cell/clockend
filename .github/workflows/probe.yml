# 試し：GitHub のサーバーから取り先が取れるか・取り込みが 1 回通るか（公開先へは送らない・訳はしない）
name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: 取り先ごとに試す
        run: python3 probe.py

      - name: Claude の API が通るか（短い 1 回）
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ARS_MODEL: ${{ vars.ARS_MODEL }}
        run: |
          pip install -q anthropic
          python3 -c "import sys; sys.path.insert(0, '_道具'); import arsfetch as a; print('モデル', a.CLAUDE_MODEL); print('返事', a.claude_json('次の英語の見出しを自然な日本語に訳し、JSON だけを返してください。形式: {\"h\": \"訳\"}。見出し: Arsenal prepare for Hull City trip'))"

      - name: 取り込みを 1 回通す
        run: |
          mkdir -p 見本_20261030
          python3 _道具/arsfetch.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-result
          path: |
            見本_20261030/data.js
            _ログ/
